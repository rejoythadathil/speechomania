name: app-release

on:
  push:
    branches: [main]
    paths: ['app.speechomania/**', '.github/workflows/app-*.yml']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app.speechomania
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: tar -czf app-dist.tar.gz -C dist .
      - id: meta
        run: echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - run: printf 'FROM scratch\nCOPY app-dist.tar.gz /app-dist.tar.gz\n' > Dockerfile.release
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: app.speechomania
          file: app.speechomania/Dockerfile.release
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/speechomania-app:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/speechomania-app:prod
