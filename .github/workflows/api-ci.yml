name: api-ci

on:
  pull_request:
    paths: ['api.speechomania/**', '.github/workflows/api-*.yml']
  push:
    branches: [main]
    paths: ['api.speechomania/**', '.github/workflows/api-*.yml']

defaults:
  run:
    working-directory: api.speechomania

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: speechomania
          POSTGRES_USER: speechomania_owner
          POSTGRES_PASSWORD: ci-owner
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U speechomania_owner" --health-interval 5s --health-retries 20
      valkey:
        image: valkey/valkey:9.0.3-alpine
        ports: ["6379:6379"]
    env:
      APP_ENV: local
      DATABASE_URL: postgres://speechomania_app:ci-app@127.0.0.1:5432/speechomania
      DATABASE_OWNER_URL: postgres://speechomania_owner:ci-owner@127.0.0.1:5432/speechomania
      VALKEY_URL: redis://127.0.0.1:6379
      FIREBASE_PROJECT_ID: demo-speechomania
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - name: Create the app database role
        run: PGPASSWORD=ci-owner psql -h 127.0.0.1 -U speechomania_owner -d speechomania -c "CREATE ROLE speechomania_app LOGIN PASSWORD 'ci-app'"
      - name: Migrations apply on an empty database
        run: bun run migrate
      - name: schema.prisma matches the migrations
        run: bun run migrate:check
      - name: Tests against Postgres and the Firebase Auth Emulator
        run: |
          echo '{"emulators":{"auth":{"port":9099},"singleProjectMode":true}}' > firebase.json
          bunx firebase-tools@15.34.1 emulators:exec --only auth --project demo-speechomania "bun test --coverage --coverage-reporter=lcov"
      - uses: SonarSource/sonarqube-scan-action@v5
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: api.speechomania
          args: -Dsonar.projectKey=api.speechomania -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
