<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speechomania · C · Summit kiosk</title>
<link rel="stylesheet" href="style.css">
<style>
body { background: #fff; }
.kiosk { min-height: 100vh; display: flex; flex-direction: column; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 20px; padding: 20px 32px; border-bottom: 1px solid var(--line); }
.bar .brand { font-size: 28px; }
.bar .brand img { width: 46px; height: 46px; }
.bar .say { flex: 1; font-size: 20px; font-weight: 600; color: var(--muted); }
.tiles { flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(max(300px, 22%), 1fr)); gap: 16px; padding: 24px 32px; }
.tile { position: relative; border: 0; padding: 0; border-radius: 22px; overflow: hidden; cursor: pointer; min-height: 260px; background: var(--mist); font: inherit; }
.tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .4s; }
.tile:hover img { transform: scale(1.04); }
.tile .label { position: absolute; left: 14px; right: 14px; bottom: 14px; background: #fff; border-radius: 14px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; color: var(--navy); }
.tile .label b { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px; display: block; }
.tile .label small { font-size: 14px; font-weight: 700; color: var(--teal-ink); }
.tile .go { width: 48px; height: 48px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; flex: none; }
.strip { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; padding: 20px 32px; background: var(--navy); color: #fff; }
.strip .steps { display: flex; flex-wrap: wrap; gap: 28px; font-size: 18px; font-weight: 600; }
.strip .steps span b { color: var(--sky); margin-right: 8px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; }
.qr { width: 96px; height: 96px; border: 2px dashed #8dd2fd; border-radius: 12px; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #8dd2fd; text-align: center; }
</style>
</head>
<body>
<main class="kiosk">
  <header class="bar">
    <a class="brand" href="#"><img src="img/mark.svg" alt="">Speechomania</a>
    <p class="say">Speech and language games for autistic children. Tap a game to see it.</p>
    <button class="btn primary" type="button" data-signin style="font-size:18px;padding:16px 26px">Sign in</button>
  </header>
  <section class="tiles" id="tiles" aria-label="Games"></section>
  <footer class="strip">
    <div class="steps">
      <span><b>1</b>Picture flashcards</span>
      <span><b>2</b>A game with the same words</span>
      <span><b>3</b>A mentor follows every child</span>
    </div>
    <div style="display:flex;align-items:center;gap:16px"><p style="color:#c9cde6;max-width:220px">Scan to get access for your child or centre</p><div class="qr">[QR CODE]</div></div>
  </footer>
</main>

<script src="games.js"></script>
<script>
const arrow = '<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'
document.getElementById('tiles').innerHTML = GAMES.map((g) => `
  <button type="button" class="tile" data-game="${g.name}">
    <img src="${g.img}" alt="">
    <span class="label"><span><small>${g.topic}</small><b>${g.name}</b></span><span class="go">${arrow}</span></span>
  </button>`).join('')
</script>
</body>
</html>
