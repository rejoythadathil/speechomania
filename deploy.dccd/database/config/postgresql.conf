listen_addresses = '*'
hba_file = '/etc/postgresql/pg_hba.conf'
password_encryption = scram-sha-256
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=dccd archive-push %p'
archive_timeout = 300
max_wal_senders = 3
log_min_duration_statement = 500
log_connections = off
log_lock_waits = on
timezone = 'UTC'
include_dir = '/etc/postgresql/conf.d'
